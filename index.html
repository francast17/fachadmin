<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Administracion Facha</title>
</head>

<body>

    <div class="glass-form-container">
       
        <h2>Administracion Facha</h2>
    
        <form id="formularioDatos" class="formulario" method="post">

            <div class="form-group">
                <label for="manicurista1"> Angela Montiel: </label>
                <input type="number" id="manicurista1" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="barbero1"> Francisco castillo: </label>
                <input type="number" id="barbero1" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="barbero2"> Lester Diaz: </label>
                <input type="number" id="barbero2" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="otros"> Otros: </label>
                <input type="number" id="otros" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="gastos"> Gastos Semana: </label>
                <input type="number" id="gastos" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="anterior"> facha Anterior: </label>
                <input type="number" id="anterior" step="0.01" required>
            </div>

            <button type="submit" id="enviar">Enviar</button>

        </form>
    </div>

      <div id="modal" class="modal-overlay">

        <div class="modal-content glass-effect">
            <span class="close-button" id="closeModal">&times;</span>
            <h3>Reporte de la semana</h3>

            <div id="modal-data">
                <p><strong> Facha 20%: </strong> <span id="modal-facha-porc"></span></p>
                <p><strong> Heymmy & Jorge: </strong> <span id="modal-heymmy-jorge"></span></p>
                <p><strong> Angela & Fran: </strong> <span id="modal-angela-fran"></span></p>
                <p><strong> Facha & total: </strong> <span id="modal-facha-total"></span></p>
            </div>

            <button id="okModal" class="modal-button">Cerrar</button>
        </div>

    </div>
</body>

<script src="scripts.js"></script>

</html>
